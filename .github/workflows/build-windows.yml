# Builds an unsigned Windows installer (.exe) of AutoSubs with the
# per-line speaker + style changes applied.
#
# Needs the file "autosubs-per-line-speaker-and-style.patch" in the ROOT of
# this repository (the top level, next to the AutoSubs-App folder).
name: Build Windows exe

on:
  workflow_dispatch:

jobs:
  build-windows:
    # windows-2022 (Visual Studio 2022) is the well-trodden setup for the
    # whisper.cpp native build; the newest image uses a very new Visual Studio.
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      # Windows cannot handle file paths over ~260 characters, and the speech
      # engine's Vulkan build makes very deep ones. Build in a short folder.
      CARGO_TARGET_DIR: 'D:\t'

    steps:
      - name: Keep line endings as-is (so the patch applies on Windows)
        shell: bash
        run: git config --global core.autocrlf false

      - name: Get the code
        uses: actions/checkout@v4

      - name: Apply the per-line speaker and style changes
        shell: bash
        run: |
          set -e
          test -f autosubs-per-line-speaker-and-style.patch || { echo "ERROR: the .patch file is missing from the top level of the repository"; exit 1; }
          git apply --ignore-whitespace --whitespace=nowarn autosubs-per-line-speaker-and-style.patch
          echo "Patch applied."

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds (makes re-runs faster)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: AutoSubs-App/src-tauri

      - name: Install the Vulkan SDK (the Windows build needs it)
        shell: pwsh
        run: |
          curl.exe -fL --retry 5 -o "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" -Wait
          $sdk = Get-ChildItem C:\VulkanSDK | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { throw "Vulkan SDK did not install" }
          if (-not (Test-Path "$($sdk.FullName)\Bin\glslc.exe")) { throw "glslc.exe not found in the Vulkan SDK" }
          "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$($sdk.FullName)\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Vulkan SDK installed at $($sdk.FullName)"

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          npm ci --prefix Adobe-Extension
          npm ci --prefix AutoSubs-App

      - name: Run the tests (stops here if the changes are broken)
        shell: bash
        run: npm test --prefix AutoSubs-App

      - name: Download ffmpeg (needed by the app)
        shell: bash
        run: |
          set -e
          cd AutoSubs-App/src-tauri
          mkdir -p binaries
          curl -fL --retry 5 -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          unzip -q ffmpeg.zip -d ffmpeg-unpacked
          cp "$(find ffmpeg-unpacked -name ffmpeg.exe | head -n 1)" binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          rm -rf ffmpeg.zip ffmpeg-unpacked
          ls -la binaries

      - name: Turn off signing and auto-update for this personal build
        shell: bash
        run: |
          # The project is set up to sign with its author's certificate and to
          # produce update files. Neither is possible on a fork, so switch them
          # off for this build.
          cat > AutoSubs-App/ci-config.json <<'JSON'
          {
            "bundle": {
              "createUpdaterArtifacts": false,
              "windows": {
                "certificateThumbprint": null,
                "signCommand": null
              }
            }
          }
          JSON

      - name: Install Ninja (a simpler build tool the speech engine compiles more reliably with)
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Set up the Microsoft C++ compiler environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build the installer
        # Windows command shell, NOT bash: Git Bash puts Git's own "link.exe"
        # (a file-listing tool) ahead of Microsoft's linker and breaks the build.
        shell: cmd
        working-directory: AutoSubs-App
        env:
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
          # Use Ninja so the nested Vulkan shader build finds the same compiler.
          CMAKE_GENERATOR: Ninja
        run: npm run tauri build -- --bundles nsis --config ci-config.json -- --no-default-features --features windows

      - name: Save the installer so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: AutoSubs-Windows-installer
          path: D:/t/release/bundle/nsis/*.exe
          if-no-files-found: error
